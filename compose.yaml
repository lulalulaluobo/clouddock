name: clouddock
services:
  app:
    image: lulalulaluobo/clouddock:${CLOUDDOCK_VERSION:-1.3.0}
    platform: linux/amd64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${BIND_IP:-0.0.0.0}:${APP_PORT:-7003}:8008"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_ENV: production
      ADMIN_USER_CODE: ${ADMIN_USER_CODE:?请设置 ADMIN_USER_CODE}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ARIA2_RPC_URL: http://aria2:6800/jsonrpc
      ARIA2_RPC_SECRET: ${ARIA2_RPC_SECRET:?请设置 ARIA2_RPC_SECRET}
      TELE_CHANNELS: ${TELE_CHANNELS:-[]}
      TG_BOT_TOKEN: ""
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
      - ${NAS_DOWNLOAD_PATH:?请设置 NAS_DOWNLOAD_PATH}:/downloads
    depends_on:
      aria2:
        condition: service_healthy
  aria2:
    image: p3terx/aria2-pro@sha256:086d1a37c586edb07ec0fb956bf9edd89d1d38d138ad5309ff96d510c8c9a011
    platform: linux/amd64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1001}
      RPC_SECRET: ${ARIA2_RPC_SECRET:?请设置 ARIA2_RPC_SECRET}
      RPC_PORT: "6800"
      UMASK_SET: "022"
      UPDATE_TRACKERS: "false"
      IPV6_MODE: "false"
    volumes:
      - ./aria2-config:/config
      - ${NAS_DOWNLOAD_PATH:?请设置 NAS_DOWNLOAD_PATH}:/downloads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "-o", "/dev/null", "-H", "Content-Type: application/json", "-d", '{"jsonrpc":"2.0","id":"hc","method":"system.listMethods"}', "http://127.0.0.1:6800/jsonrpc"]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 20s
